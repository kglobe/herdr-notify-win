[package]
name = "herdr-toast"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
uds_windows = "1"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Notifications",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
